version: 2

models:
  - name: stg_ad_spend
    description: "Cleaned ad spend — one row per channel/campaign/day. Duplicates removed, channel casing normalized, negative spend nulled."
    columns:
      - name: spend_date
        tests: [not_null]
      - name: channel
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Organic Search','Paid Search','Referral','Social','Email']
      - name: spend
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
              config:
                where: "spend is not null"
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - spend_date
              - channel
              - campaign