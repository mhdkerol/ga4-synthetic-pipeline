version: 2

models:
  - name: int_channel_daily_spend
    description: Ad spend rolled up to one row per channel per day (campaigns summed).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [spend_date, channel]
    columns:
      - name: spend_date
        data_tests: [not_null]
      - name: channel
        data_tests: [not_null]

  - name: int_channel_daily_sessions
    description: Sessions rolled up to one row per channel per day.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [session_date, channel]
    columns:
      - name: session_date
        data_tests: [not_null]
      - name: channel
        data_tests: [not_null]